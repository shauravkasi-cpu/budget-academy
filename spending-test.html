<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Budget Academy - Spending Test</title>
  <link rel="icon" href="logo.png">
  <link rel="stylesheet" href="style.css">
  <script src="theme.js"></script>
</head>
<body class="app">

  <!-- menu on the left -->
  <nav class="sidebar">
    <div class="brand">
      <img src="logo.png" alt="">
      <span>Budget Academy</span>
    </div>

    <!-- the 2 main sections -->
    <div class="section-switch">
      <a href="overview.html">My Money</a>
      <a href="lessons.html" class="active">Learn Mode</a>
    </div>

    <!-- the pages inside "Learn Mode" -->
    <p class="menu-label">Learn Mode</p>
    <a class="menu-link" href="lessons.html">Lessons</a>
    <a class="menu-link" href="practice.html">Practice Month</a>
    <a class="menu-link active" href="spending-test.html">Spending Test</a>
    <a class="menu-link" href="past-tests.html">Past Tests</a>
    <a class="menu-link" href="calculators.html">Calculators</a>

    <!-- bottom of the menu -->
    <div class="sidebar-bottom">
      <a class="menu-link" href="settings.html">Settings</a>
      <div class="user-row">
        <span class="avatar" id="avatar"></span>
        <span class="user-name" id="profile-name"></span>
        <button class="logout-button" onclick="logOut()">Log out</button>
      </div>
    </div>
  </nav>

  <main class="page">
    <div class="content">

      <h1>Spending Test</h1>

      <!-- 1. what you make -->
      <div class="card">
        <p class="card-title">How much do you make?</p>
        <div class="calc-inputs">
          <div class="calc-input">
            <label for="test-income">Monthly take-home pay ($)</label>
            <input type="text" id="test-income" placeholder="2000">
          </div>
          <!-- take-home pay is your pay AFTER taxes, so this helps you figure it out -->
          <a class="pill-button next-to-input" href="taxes.html#paycheck-card">Tax calculator</a>
        </div>
        <button class="pill-button" onclick="useMyBudget()">Use my numbers from the Budget page</button>
      </div>

      <!-- 2. what you spend (spending-test.js adds a box for each category) -->
      <div class="card">
        <p class="card-title">Needs</p>
        <div class="calc-inputs" id="need-boxes"></div>

        <p class="card-title test-row">Wants</p>
        <div class="calc-inputs" id="want-boxes"></div>

        <p class="card-title test-row">Savings</p>
        <div class="calc-inputs">
          <div class="calc-input">
            <label for="test-savings">Put into savings ($)</label>
            <input type="text" id="test-savings" placeholder="0">
          </div>
        </div>

        <p class="feedback feedback-wrong" id="test-error"></p>
        <button class="pill-button green-pill" onclick="gradeTest()">Get my score</button>
      </div>

      <!-- 3. your score (spending-test.js fills this in) -->
      <div class="card" id="test-results" hidden></div>

    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js"></script>
  <script src="cloud.js"></script>
  <script src="common.js"></script>
  <script src="money.js"></script>
  <script src="money-data.js"></script>
  <script src="lessons-data.js"></script>
  <script src="spending-test.js"></script>
</body>
</html>
