<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Budget Academy - Lesson</title>
  <link rel="icon" href="logo.png">
  <link rel="stylesheet" href="style.css">
  <script src="theme.js"></script>
</head>
<body class="app">

  <!-- menu on the left -->
  <nav class="sidebar">
    <div class="brand">
      <img src="logo.png" alt="">
      <span>Budget Academy</span>
    </div>

    <!-- the 2 main sections -->
    <div class="section-switch">
      <a href="overview.html">My Money</a>
      <a href="lessons.html" class="active">Learn Mode</a>
    </div>

    <!-- the pages inside "Learn Mode" -->
    <p class="menu-label">Learn Mode</p>
    <a class="menu-link active" href="lessons.html">Lessons</a>
    <a class="menu-link" href="practice.html">Practice Month</a>
    <a class="menu-link" href="spending-test.html">Spending Test</a>
    <a class="menu-link" href="past-tests.html">Past Tests</a>

    <!-- bottom of the menu -->
    <div class="sidebar-bottom">
      <button class="menu-link" id="theme-button" onclick="toggleTheme()">Light mode</button>
      <div class="user-row">
        <span class="avatar" id="avatar"></span>
        <span class="user-name" id="profile-name"></span>
        <button class="logout-button" onclick="logOut()">Log out</button>
      </div>
    </div>
  </nav>

  <main class="page">
    <div class="content">

      <!-- back to the Learn Mode page -->
      <p><a href="lessons.html">&larr; Back to all lessons</a></p>

      <!-- the lesson -->
      <div class="card">
        <p class="card-label" id="lesson-number"></p>
        <p class="huge-text" id="lesson-title"></p>
        <p class="lesson-description" id="lesson-description"></p>
      </div>

      <!-- shows only if this lesson isn't written yet -->
      <div class="card" id="coming-soon" hidden>
        <p class="card-label">Coming soon</p>
        <p class="tip-text">The full lesson and a short quiz will go here.</p>
      </div>

      <!-- the lesson's sections get added here by lesson.js -->
      <div id="lesson-sections"></div>

      <!-- the quiz questions get added here by lesson.js -->
      <div id="quiz-area" hidden>
        <h2 class="quiz-title">Quiz</h2>
        <div id="quiz-questions"></div>
      </div>

      <!-- shows after you answer every question -->
      <div class="card quiz-result" id="quiz-result" hidden>
        <p class="card-label">Your score</p>
        <p class="huge-text" id="quiz-score"></p>
        <p class="lesson-description" id="quiz-message"></p>
        <button class="resume-button" onclick="finishLesson()">Finish lesson</button>
      </div>

      <!-- go to the lesson before or after this one -->
      <div class="two-columns">
        <button class="demo-button" id="previous-button" onclick="previousLesson()">&larr; Previous lesson</button>
        <button id="next-button" onclick="nextLesson()">Next lesson &rarr;</button>
      </div>

    </div>
  </main>

  <script src="common.js"></script>
  <script src="lessons-data.js"></script>
  <script src="lesson.js"></script>
</body>
</html>
