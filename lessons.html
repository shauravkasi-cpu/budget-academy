<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Budget Academy - Learn Mode</title>
  <link rel="icon" href="logo.png">
  <link rel="stylesheet" href="style.css">
  <script src="theme.js"></script>
</head>
<body class="app">

  <!-- menu on the left -->
  <nav class="sidebar">
    <div class="brand">
      <img src="logo.png" alt="">
      <span>Budget Academy</span>
    </div>

    <!-- the 2 main sections -->
    <div class="section-switch">
      <a href="overview.html">My Money</a>
      <a href="lessons.html" class="active">Learn Mode</a>
    </div>

    <!-- the pages inside "Learn Mode" -->
    <p class="menu-label">Learn Mode</p>
    <a class="menu-link active" href="lessons.html">Lessons</a>
    <a class="menu-link" href="practice.html">Practice Month</a>
    <a class="menu-link" href="spending-test.html">Spending Test</a>
    <a class="menu-link" href="past-tests.html">Past Tests</a>

    <!-- bottom of the menu -->
    <div class="sidebar-bottom">
      <button class="menu-link" id="theme-button" onclick="toggleTheme()">Light mode</button>
      <div class="user-row">
        <span class="avatar" id="avatar"></span>
        <span class="user-name" id="profile-name"></span>
        <button class="logout-button" onclick="logOut()">Log out</button>
      </div>
    </div>
  </nav>

  <main class="page">
    <div class="content">

      <!-- 1. the lesson you're on, with a Resume button -->
      <div class="card">
        <p class="card-label">You're on</p>
        <p class="huge-text" id="current-lesson"></p>
        <p class="lesson-description" id="current-description"></p>

        <div class="bar"><div class="bar-fill" id="course-bar"></div></div>
        <p class="small-text" id="course-progress"></p>

        <button class="resume-button" id="resume-button" onclick="resumeLesson()">Resume</button>
      </div>

      <!-- 2. button that shows or hides all the lessons -->
      <button class="pill-button" id="all-button" onclick="toggleAllLessons()">See all courses</button>

      <!-- 3. a card for every lesson, hidden until you click the button -->
      <!-- lessons.js adds the cards here -->
      <div class="two-columns all-lessons" id="all-lessons" hidden></div>

    </div>
  </main>

  <script src="common.js"></script>
  <script src="lessons-data.js"></script>
  <script src="lessons.js"></script>
</body>
</html>
