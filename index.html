<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Budget Academy</title>
  <link rel="icon" href="logo.png">
  <link rel="stylesheet" href="style.css">
  <script src="theme.js"></script>
</head>
<body>

  <!-- Log In page -->
  <main class="login-page">

    <!-- logo, name, and slogan -->
    <img class="logo" src="logo.png" alt="Budget Academy logo">
    <h1>Budget Academy</h1>
    <p class="slogan">Budgeting is a skill.</p>

    <!-- log in form -->
    <form class="login-box" id="login-form">
      <label for="username">Username</label>
      <input type="text" id="username" required>

      <label for="password">Password</label>
      <input type="password" id="password" required>

      <button type="submit" id="login-button">Log In</button>

      <!-- login.js shows a message here if the password is wrong -->
      <p class="feedback feedback-wrong" id="login-error" hidden></p>
    </form>

    <p class="signup-text">Don't have an account? <a href="signup.html">Sign up</a></p>

  </main>

  <!-- the Supabase library, then our code that uses it -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js"></script>
  <script src="cloud.js"></script>
  <script src="login.js"></script>
</body>
</html>
