<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Budget Academy - Demo</title>
  <link rel="icon" href="logo.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- asks for a name before starting the demo -->
  <main class="login-page">

    <img class="logo" src="logo.png" alt="Budget Academy logo">
    <h1>Try the demo</h1>
    <p class="slogan">See every feature with sample data.</p>

    <form class="login-box" id="demo-form">
      <label for="demo-name">What should we call you?</label>
      <input type="text" id="demo-name" placeholder="Alex" required>

      <button type="submit">Start demo</button>
    </form>

    <p class="signup-text"><a href="index.html">Back to Log In</a></p>

  </main>

  <script src="demo.js"></script>
</body>
</html>
