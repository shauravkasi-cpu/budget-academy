<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Budget Academy - Past Tests</title>
  <link rel="icon" href="logo.png">
  <link rel="stylesheet" href="style.css">
  <script src="theme.js"></script>
</head>
<body class="app">

  <!-- menu on the left -->
  <nav class="sidebar">
    <div class="brand">
      <img src="logo.png" alt="">
      <span>Budget Academy</span>
    </div>

    <!-- the 2 main sections -->
    <div class="section-switch">
      <a href="overview.html">My Money</a>
      <a href="lessons.html" class="active">Learn Mode</a>
    </div>

    <!-- the pages inside "Learn Mode" -->
    <p class="menu-label">Learn Mode</p>
    <a class="menu-link" href="lessons.html">Lessons</a>
    <a class="menu-link" href="practice.html">Practice Month</a>
    <a class="menu-link" href="spending-test.html">Spending Test</a>
    <a class="menu-link active" href="past-tests.html">Past Tests</a>
    <a class="menu-link" href="calculators.html">Calculators</a>

    <!-- bottom of the menu -->
    <div class="sidebar-bottom">
      <a class="menu-link" href="settings.html">Settings</a>
      <div class="user-row">
        <span class="avatar" id="avatar"></span>
        <span class="user-name" id="profile-name"></span>
        <button class="logout-button" onclick="logOut()">Log out</button>
      </div>
    </div>
  </nav>

  <main class="page">
    <div class="content">

      <h1>Past Tests</h1>

      <!-- past-tests.js fills all of these in -->

      <!-- 1. tests taken, best score, last score -->
      <div class="calc-results" id="test-numbers"></div>

      <!-- 2. a bar for each of your last 10 scores (hidden when there are no tests) -->
      <div id="chart-section">
        <div class="section-header">
          <p class="section-title">Your scores</p>
          <a class="pill-button small-pill" href="spending-test.html">Take a test</a>
        </div>
        <div class="card" id="score-chart"></div>
      </div>

      <!-- 3. every test, newest first -->
      <div class="section-header">
        <p class="section-title">All tests</p>
      </div>
      <div id="test-list"></div>

    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js"></script>
  <script src="cloud.js"></script>
  <script src="common.js"></script>
  <script src="money.js"></script>
  <script src="money-data.js"></script>
  <script src="past-tests.js"></script>
</body>
</html>
